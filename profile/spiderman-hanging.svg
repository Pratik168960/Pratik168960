<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 520" width="200" height="520">
  <!-- Web line from top -->
  <line x1="100" y1="0" x2="100" y2="160" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Web node/attachment point -->
  <circle cx="100" cy="160" r="4" fill="#00F0FF" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Spider figure body (hanging upside down) -->
  <g transform="translate(100, 240)">
    <!-- Gentle swinging animation -->
    <animateTransform attributeName="transform" type="rotate" values="-3,100,240;3,100,240;-3,100,240" dur="4s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Web lines from attachment to body -->
    <line x1="0" y1="-80" x2="0" y2="-40" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Legs (on top since upside down) -->
    <!-- Left leg -->
    <line x1="-12" y1="-38" x2="-25" y2="-65" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
    <line x1="-25" y1="-65" x2="-18" y2="-85" stroke="#00F0FF" stroke-width="5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="12" y1="-38" x2="25" y2="-65" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="-65" x2="18" y2="-85" stroke="#00F0FF" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Body (torso) -->
    <ellipse cx="0" cy="-20" rx="22" ry="28" fill="#FF0055"/>
    <!-- Chest spider emblem -->
    <g transform="translate(0,-20)">
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#090d16"/>
      <line x1="-4" y1="-3" x2="-14" y2="-10" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-3" x2="14" y2="-10" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="-16" y2="0" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="16" y2="0" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-3" y1="3" x2="-12" y2="10" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="3" y1="3" x2="12" y2="10" stroke="#090d16" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Web pattern lines on suit -->
    <line x1="-22" y1="-20" x2="22" y2="-20" stroke="#090d16" stroke-width="0.5" opacity="0.4"/>
    <line x1="-20" y1="-30" x2="20" y2="-30" stroke="#090d16" stroke-width="0.5" opacity="0.4"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#090d16" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Arms -->
    <!-- Left arm reaching out -->
    <line x1="-22" y1="-15" x2="-45" y2="10" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
    <line x1="-45" y1="10" x2="-55" y2="30" stroke="#FF0055" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm shooting web -->
    <line x1="22" y1="-15" x2="45" y2="5" stroke="#FF0055" stroke-width="6" stroke-linecap="round"/>
    <line x1="45" y1="5" x2="60" y2="25" stroke="#FF0055" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Web shooting from right hand -->
    <line x1="60" y1="25" x2="90" y2="55" stroke="#00F0FF" stroke-width="1" opacity="0.6" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="25" x2="95" y2="40" stroke="#00F0FF" stroke-width="1" opacity="0.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="25" x2="85" y2="65" stroke="#00F0FF" stroke-width="1" opacity="0.4" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" from="0" to="14" dur="0.8s" repeatCount="indefinite"/>
    </line>
    
    <!-- Head (on bottom since upside down) -->
    <circle cx="0" cy="18" r="18" fill="#FF0055"/>
    <!-- Mask pattern -->
    <line x1="-18" y1="18" x2="18" y2="18" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="36" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
    <!-- Eyes (large, expressive Spider-Man eyes) -->
    <g>
      <!-- Left eye -->
      <path d="M -14,12 Q -10,6 -5,10 Q -8,18 -14,16 Z" fill="white" stroke="#090d16" stroke-width="1.5">
        <animate attributeName="d" values="M -14,12 Q -10,6 -5,10 Q -8,18 -14,16 Z;M -13,13 Q -10,9 -6,12 Q -8,17 -13,16 Z;M -14,12 Q -10,6 -5,10 Q -8,18 -14,16 Z" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- Right eye -->
      <path d="M 14,12 Q 10,6 5,10 Q 8,18 14,16 Z" fill="white" stroke="#090d16" stroke-width="1.5">
        <animate attributeName="d" values="M 14,12 Q 10,6 5,10 Q 8,18 14,16 Z;M 13,13 Q 10,9 6,12 Q 8,17 13,16 Z;M 14,12 Q 10,6 5,10 Q 8,18 14,16 Z" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Web pattern on head -->
    <path d="M 0,0 Q -5,10 -18,18" fill="none" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0,0 Q 5,10 18,18" fill="none" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0,0 Q -12,5 -18,10" fill="none" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0,0 Q 12,5 18,10" fill="none" stroke="#090d16" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Small decorative web strands from the main line -->
  <line x1="100" y1="60" x2="80" y2="80" stroke="#00F0FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="90" x2="120" y2="110" stroke="#00F0FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="120" x2="85" y2="140" stroke="#00F0FF" stroke-width="0.8" opacity="0.3"/>
</svg>
