name: Update README cards

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0B0614&title_color=F5EDE0&text_color=D4CBE8&icon_color=C4B5FD&ring_color=7C3AED
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0B0614&title_color=F5EDE0&text_color=D4CBE8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        continue-on-error: true
        run: |
          mkdir -p profile
          curl -fsSL "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&hide_border=true&background=0B0614&ring=7C3AED&fire=C4B5FD&currStreakLabel=F5EDE0" -o profile/streak.svg

      - name: Trophy card
        continue-on-error: true
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=tokyonight&column=6&row=1&margin-w=8&margin-h=8
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile cards" || echo "No card changes"
          git push
